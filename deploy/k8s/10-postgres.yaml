# PostgreSQL + pgvector backed by persistent EBS storage
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: fdr
spec:
  # Headless Service provides stable DNS for the StatefulSet pod
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: fdr
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      automountServiceAccountToken: false   # never talks to the Kubernetes API
      nodeSelector:
        workload: cpu        # keepibng the database Off the expensive GPU node
      containers:
        - name: postgres
          # pinned the pgvector/Postgres image for reproducible deployments
          image: pgvector/pgvector:0.8.1-pg16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: fdr
            - name: POSTGRES_DB
              value: fdr
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fdr-secrets
                  key: postgres-password
            # a subdirectory inside the mounted volume for Postgres data
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "fdr", "-d", "fdr"]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "fdr", "-d", "fdr"]
            initialDelaySeconds: 45
            periodSeconds: 20
          resources:
            requests: {cpu: "250m", memory: "512Mi"}
            limits:   {cpu: "1000m", memory: "1Gi"}
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        # encrypted gp3 storageclass defined in storageclass.yaml
        storageClassName: fdr-gp3
        resources:
          requests:
            storage: 10Gi
