[project]
name = "flight-delay-rag"
version = "0.1.0"
description = "RAG chatbot for flight delay compensation, with live flight status via AirLabs"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "numpy>=1.26",
  "lxml>=5.1",
  "psycopg[binary]>=3.1",
  "prometheus-client>=0.20",
  "jinja2>=3.1",
  "pymupdf>=1.24",
]

[project.optional-dependencies]
ml = [
  "sentence-transformers>=2.7",
  "torch>=2.2",
]
# evaluation-only dependencies
# langchain-community is constrained for compatibility with Ragas
eval = [
  "ragas>=0.4,<0.5",
  "langchain-community<0.4",
  "openai>=1.0",
]
dev = ["pytest>=8.0", "ruff>=0.3"]

[project.scripts]
fdr-api = "flight_delay.api:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv]
# exclude an unused Ragas dependency that has no supported wheel for this setup
override-dependencies = ["scikit-network; python_version < '3.0'"]

[tool.uv.workspace]
members = [
    ".",
]

[tool.uv.sources]
flight-delay-rag = { workspace = true }
# Use the CPU-only PyTorch index for Linux container builds
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "flight-delay-rag",
]
